<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilim.uz | Bolajonlar uchun Aqlli Yordamchi</title>
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --bg: #F0F2F5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 2rem;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 15px;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 15px 25px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #5751d9;
            transform: scale(1.05);
        }

        #result {
            margin-top: 2rem;
            padding: 20px;
            background: #f9f9f9;
            border-left: 5px solid var(--secondary);
            border-radius: 10px;
            text-align: left;
            min-height: 50px;
            display: none;
            line-height: 1.6;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Bilim.uz</h1>
    <p>Xohlagan narsangni so'ra, men senga o'rgataman!</p>
    
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Masalan: Nega osmon ko'k?">
        <button onclick="askAI()">Bilishni xohlayman!</button>
    </div>

    <div class="loader" id="loader"></div>
    <div id="result"></div>
</div>

<script>
    async function askAI() {
        const input = document.getElementById('userInput').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!input) {
            alert("Iltimos, savol yozing!");
            return;
        }

        // Vizual effektlar
        resultDiv.style.display = 'none';
        loader.style.display = 'block';

        try {
            /* 
               DIQQAT: Haqiqiy internetdan ma'lumot olish uchun bu yerda 
               OpenAI, Google Gemini yoki boshqa API'ga ulanish kerak.
               Hozircha simulyatsiya qilamiz:
            */
            
            setTimeout(() => {
                loader.style.display = 'none';
                resultDiv.style.display = 'block';
                
                // Bu qismda AI javobi shakllanadi
                resultDiv.innerHTML = `
                    <strong>Sening savoling:</strong> ${input} <br><br>
                    <strong>Mening javobim:</strong> 👋 Salom! Bu ajoyib savol. 
                    Hozircha men o'rganish jarayonidaman, lekin sening "${input}" haqidagi 
                    so'roving bo'yicha eng qiziqarli ma'lumotlarni qidirib topishga tayyorman!
                `;
            }, 1500);

        } catch (error) {
            loader.style.display = 'none';
            alert("Xatolik yuz berdi, qaytadan urinib ko'ring.");
        }
    }
</script>

</body>
</html>
